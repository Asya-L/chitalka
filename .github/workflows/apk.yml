name: APK для Boox

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/release/app-release.apk mezhdu-strok.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mezhdu-strok-apk
          path: mezhdu-strok.apk

      - name: Выложить в релиз «apk»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Между строк для Android / Boox
          body: |
            Приложение для Onyx Boox и других Android-устройств. Скачайте mezhdu-strok.apk и установите (разрешите установку из неизвестных источников).
            Сборка №${{ github.run_number }}.
          files: mezhdu-strok.apk
          make_latest: true
